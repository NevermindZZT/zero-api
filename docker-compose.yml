services:
  zero-api:
    image: nevermindzzt/zero-api:latest
    container_name: zero-api
    restart: unless-stopped
    ports:
      - "8080:8080"   # API 服务
      - "8520:8520"   # 代理服务
      # OAuth 回调端口只绑定宿主机回环地址，通过 SSH 隧道给本地浏览器使用，避免暴露公网。
      - "127.0.0.1:1455:1455"   # Codex
      - "127.0.0.1:54545:54545" # Claude
      - "127.0.0.1:51121:51121" # Antigravity
    volumes:
      - ./data:/app/data
      - ./certs:/app/certs
      - ./configs:/app/configs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TZ=Asia/Shanghai
